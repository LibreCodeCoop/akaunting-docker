services:
  akaunting.php:
    volumes:
      - ~/.composer:/var/www/.composer
      - ~/.npm:/var/www/.npm/
    environment:
      - MAIL_HOST=${MAIL_HOST:-mailpit}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - OPENBAO_ADDR=${OPENBAO_ADDR:-http://openbao:8200}
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-dev-only-root-token}
      - OPENBAO_MOUNT=${OPENBAO_MOUNT:-/nfse}
    depends_on:
      openbao:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - 127.0.0.1:8025:8025
      - 127.0.0.1:1025:1025

  openbao:
    image: openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    command: server -dev
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=${OPENBAO_TOKEN:-dev-only-root-token}
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  openbao-init:
    image: openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      - BAO_ADDR=http://openbao:8200
      - BAO_TOKEN=${OPENBAO_TOKEN:-dev-only-root-token}
    command:
      - sh
      - -ec
      - |
        if ! bao secrets list -format=json | grep -q '"nfse/"'; then
          bao secrets enable -path=nfse kv-v2
        fi

        echo "OpenBao ready:"
        bao secrets list
    restart: "no"

  dufs:
    image: sigoden/dufs:v0.46.0
    command: /data -A --allow-upload --allow-delete
    restart: unless-stopped
    volumes:
      - ./volumes/webdav:/data
    ports:
      - 127.0.0.1:5000:5000

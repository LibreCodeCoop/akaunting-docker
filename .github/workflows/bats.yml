name: Bats

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bats
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run Bats
        run: bats tests/*.bats

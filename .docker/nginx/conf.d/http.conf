map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen ${NGINX_PORT};

    access_log /dev/stdout;
    error_log /dev/stdout;

    client_max_body_size 40M;

    # Enable gzip but do not remove ETag headers.
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types application/atom+xml application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

    add_header Referrer-Policy                   "no-referrer" always;
    add_header X-Content-Type-Options            "nosniff" always;
    add_header X-Download-Options                "noopen" always;
    add_header X-Frame-Options                   "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Robots-Tag                      "none" always;

    # Remove X-Powered-By, which is an information leak.
    fastcgi_hide_header X-Powered-By;

    root /var/www/html;
    index index.html index.htm index.php;
    charset utf-8;

    # Prevent direct access to protected files.
    location ~ /(?:\.env|\.git)(?:/|$) {
        deny all;
    }

    location ~ \.log$ {
        deny all;
    }

    # Prevent direct access to protected application folders.
    location ~ ^/(?:app|bootstrap|config|database|overrides|routes|storage|tests)(?:/|$) {
        deny all;
    }

    location = /artisan {
        deny all;
    }

    # Prevent direct access to modules/vendor folders except static assets.
    location ~ ^/(modules|vendor)\/(.*)\.((?!ico|gif|jpg|jpeg|png|js|css|less|sass|font|woff|woff2|eot|ttf|svg).)*$ {
        deny all;
    }

    # Cache static assets in the browser. Akaunting versions asset URLs, so a
    # new application release naturally invalidates the cached representation.
    # Protected application directories are denied above before this regex.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
    }

    error_page 404 /index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass akaunting.php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
    }
}

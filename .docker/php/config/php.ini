; Xdebug is installed for development diagnostics, but production requests must
; not pay the step-debugger startup cost. Enable it explicitly with
; XDEBUG_MODE=debug and trigger a session from the client when needed.
xdebug.client_host=host.docker.internal
xdebug.discover_client_host=true
xdebug.log_level=0
xdebug.mode=off
xdebug.start_with_request=trigger

error_reporting=E_ALL & ~E_DEPRECATED
